# .github/workflows/release-npm.yml
#
# Publishes the @quatico/magellan-* npm packages to npmjs.org via OIDC trusted
# publishing. Triggered when Jenkins pushes a release tag (vX.Y.Z) to the GitHub
# mirror at quatico-solutions/magellan.
#
# Prerequisites:
#   - On npmjs.com, each scoped package must have a Trusted Publisher registered
#     pointing at this workflow filename (release-npm.yml) on this repository.
#   - The Jenkins release pipeline must NOT also publish to npmjs.org (handled
#     by the gradle change that removes publishNpmToNpmJs).

name: Publish to npmjs.org

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # release tags only — never -SNAPSHOT
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)publish, e.g. v0.19.7'
        required: true
        type: string
      dry_run:
        description: 'Build, test and pack, but run npm publish with --dry-run'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # required for npm OIDC trusted publishing

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # Node 24: npm trusted publishing requires npm >= 11.5.1, and
          # npm@latest (12.x) requires Node ^22.22.2, ^24.15.0 or >= 26. The
          # sources build and test on Node 24 (.nvmrc, Jenkins image
          # nodejs-24-gradle-9-jdk25-noble).
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      # Upgrade npm for OIDC trusted publishing support.
      - run: npm install -g npm@latest

      # The mirror carries the version committed in the Bitbucket source, which
      # is a -SNAPSHOT.0 version since the Jenkins release excludes
      # :node:publishNpm (and with it the version rewrite). The published
      # version must equal the tag, so set it from the tag.
      - name: Set the package versions from the tag
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "Publishing version $VERSION"
          pnpm -r --filter "./packages/*" exec npm pkg set version="$VERSION"

      # `--no-frozen-lockfile` is required because the mirror's package.json and
      # pnpm-lock.yaml come from different layers of the Bitbucket source tree
      # (node/package.json vs the workspace-root pnpm-lock.yaml), which are
      # inherently inconsistent on the mirror's flat layout. This matches the
      # convention of the previous CI workflows on the mirror.
      - run: pnpm install --no-frozen-lockfile

      - run: pnpm -r run build

      # Unit tests only. Jenkins ran e2e (test:e2e) on the same source tree
      # before pushing this tag, so we don't repeat that here.
      - run: pnpm -r run test

      # Publishing flow: pnpm pack rewrites workspace:* deps to concrete
      # versions in each tarball; npm publish then handles OIDC trusted
      # publishing. Using pnpm publish directly would not invoke npm's OIDC
      # logic reliably with pnpm 9.
      - name: Publish each package to npmjs.org with provenance
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          mkdir -p /tmp/tarballs
          pnpm -r --filter "./packages/*" exec pnpm pack --pack-destination /tmp/tarballs
          ls -1 /tmp/tarballs
          for tgz in /tmp/tarballs/*.tgz; do
            echo "::group::Publishing $tgz"
            tar -xzOf "$tgz" package/package.json | node -e 'const p = JSON.parse(require("fs").readFileSync(0)); console.log(p.name + "@" + p.version, JSON.stringify(p.dependencies || {}))'
            npm publish "$tgz" --access public --provenance $DRY_RUN
            echo "::endgroup::"
          done
